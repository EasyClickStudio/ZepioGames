<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZepioGames — Free Online Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #12141d;
      --bg-elevated: #1a1d2b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --radius: 16px;
      --sidebar-w: 230px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .header-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .logo span {
      background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 18px 10px 42px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: #202436;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Layout */
    .app-layout {
      display: flex;
      flex: 1;
    }

    /* Categories Sidebar */
    aside.sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      flex-shrink: 0;
    }

    aside.sidebar::-webkit-scrollbar { width: 4px; }
    aside.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .nav-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-item:hover {
      background: var(--bg-elevated);
      color: #fff;
    }

    .nav-item.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .nav-emoji {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
      width: calc(100% - var(--sidebar-w));
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .feed-title {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--border-focus);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5), 0 0 24px var(--primary-glow);
    }

    .card-thumb {
      width: 100%;
      padding-top: 68%;
      position: relative;
      background: #0f1118;
      overflow: hidden;
    }

    .card-thumb img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .game-card:hover .card-thumb img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 12px 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Modal Player */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.95);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .player-modal.active { display: flex; }

    .player-window {
      width: 100%;
      max-width: 1140px;
      height: 90vh;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px var(--primary-glow);
    }

    .player-header {
      height: 52px;
      background: #141724;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .game-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ctrl {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-ctrl:hover {
      background: var(--primary);
    }

    .btn-close {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-close:hover {
      background: #ef4444;
      color: #fff;
    }

    .iframe-stage {
      flex: 1;
      width: 100%;
      background: #000;
      position: relative;
      cursor: pointer;
    }

    .iframe-stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Branded Loading Overlay with Glass Plate */
    .zepio-loader {
      position: absolute;
      inset: 0;
      background: #090a10;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .zepio-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Sleek Loading Plate */
    .loading-plate {
      background: rgba(18, 20, 31, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 40px;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px var(--primary-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .loading-plate::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
    }

    .plate-thumb-wrap {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .plate-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .plate-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .plate-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-elevated);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 22px;
    }

    .bar-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .loader-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .loader-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      box-shadow: 0 0 14px var(--accent);
      border-radius: 999px;
      transition: width 0.15s ease-out;
    }

    .loader-status {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* Branded Error Screen */
    .zepio-error-screen {
      position: absolute;
      inset: 0;
      background: #0c0e15;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .zepio-error-screen.visible { display: flex; }

    .err-icon { font-size: 46px; margin-bottom: 12px; }
    .err-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .err-desc { font-size: 13px; color: var(--text-muted); max-width: 400px; margin-bottom: 20px; line-height: 1.5; }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 800px) {
      aside.sidebar { display: none; }
      .main-content { width: 100%; padding: 16px; }
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .player-window { height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo" onclick="resetFilter()">
        <div class="logo-badge">⚡</div>
        <div>Zepio<span>Games</span></div>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search games...">
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="nav-label">Discover</div>
      <div class="nav-item active" onclick="filterCat('All')">
        <span class="nav-emoji">🔥</span>
        <span>All Games</span>
      </div>
      <div class="nav-item" onclick="filterCat('Action')">
        <span class="nav-emoji">⚔️</span>
        <span>Action</span>
      </div>
      <div class="nav-item" onclick="filterCat('Arcade')">
        <span class="nav-emoji">🕹️</span>
        <span>Arcade</span>
      </div>
      <div class="nav-item" onclick="filterCat('Retro')">
        <span class="nav-emoji">👾</span>
        <span>Retro</span>
      </div>
      <div class="nav-item" onclick="filterCat('Puzzle')">
        <span class="nav-emoji">🧩</span>
        <span>Puzzle</span>
      </div>
      <div class="nav-item" onclick="filterCat('2 Player')">
        <span class="nav-emoji">👥</span>
        <span>2 Player</span>
      </div>
      <div class="nav-item" onclick="filterCat('Racing')">
        <span class="nav-emoji">🏎️</span>
        <span>Racing</span>
      </div>
      <div class="nav-item" onclick="filterCat('Adventure')">
        <span class="nav-emoji">🏹</span>
        <span>Adventure</span>
      </div>
      <div class="nav-item" onclick="filterCat('Shooter')">
        <span class="nav-emoji">🎯</span>
        <span>Shooter</span>
      </div>
      <div class="nav-item" onclick="filterCat('Sports')">
        <span class="nav-emoji">⚽</span>
        <span>Sports</span>
      </div>
    </aside>

    <main class="main-content">
      <div class="feed-header">
        <div class="feed-title">
          <span id="categoryEmoji">🔥</span>
          <span id="categoryTitle">All Games</span>
        </div>
      </div>
      <div class="games-grid" id="gamesGrid"></div>
    </main>
  </div>

  <!-- Theater Player Modal -->
  <div class="player-modal" id="playerModal">
    <div class="player-window" id="playerWindow">
      <div class="player-header">
        <span class="game-name" id="activeGameTitle">Loading...</span>
        <div class="player-controls">
          <button class="btn-ctrl" onclick="reloadGame()">🔄 Restart</button>
          <button class="btn-ctrl" onclick="toggleFullscreen()">⛶ Fullscreen</button>
          <button class="btn-ctrl btn-close" onclick="closePlayer()">✕ Close</button>
        </div>
      </div>

      <div class="iframe-stage" id="iframeStage">
        <!-- Zepio Branded Loader with Clean Plate -->
        <div class="zepio-loader" id="zepioLoader">
          <div class="loading-plate">
            <div class="plate-thumb-wrap">
              <img id="plateThumb" src="" alt="Game Poster">
            </div>
            <div class="plate-title" id="plateTitle">Game Title</div>
            <div class="plate-badge" id="plateCategory">Arcade</div>

            <div class="bar-row">
              <span id="loaderStatus">Starting game engine...</span>
              <span id="loaderPercent">0%</span>
            </div>

            <div class="loader-bar-wrap">
              <div class="loader-bar-fill" id="loaderBarFill"></div>
            </div>
          </div>
        </div>

        <!-- Custom Error Screen -->
        <div class="zepio-error-screen" id="zepioError">
          <div class="err-icon">⚠️</div>
          <div class="err-title">Game Not Found</div>
          <div class="err-desc">The game files could not be reached or the link has not been published yet.</div>
          <button class="btn-ctrl" onclick="closePlayer()">Go Back to Games</button>
        </div>

        <iframe id="gameIframe" allow="fullscreen; autoplay; gamepad; keyboard" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    let games = [];
    let currentCategory = 'All';
    let currentGame = null;
    let progressTimer = null;
    let isIframeReady = false;

    async function init() {
      try {
        const res = await fetch('games.json');
        if (!res.ok) throw new Error('games.json missing');
        games = await res.json();
      } catch (err) {
        games = [];
      }

      renderGrid();
      setupSearch();
      setupStageFocus();
    }

    function renderGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('gamesGrid');

      const filtered = games.filter(g => {
        const matchCat = currentCategory === 'All' || g.category.toLowerCase() === currentCategory.toLowerCase();
        const matchSearch = g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-box">
            <div style="font-size: 40px; margin-bottom: 12px;">🕹️</div>
            <h3>No Games Available</h3>
            <p>Add your first game to games.json to see it here!</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(g => `
        <div class="game-card" onclick="launchGame('${g.id}')">
          <div class="card-thumb">
            <img src="${g.thumbnail}" alt="${g.title}" loading="lazy">
          </div>
          <div class="card-info">
            <div class="card-title">${g.title}</div>
            <div class="card-meta">
              <span>${g.category}</span>
              <span>▶ Play</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCat(cat) {
      currentCategory = cat;
      document.getElementById('categoryTitle').textContent = cat === 'All' ? 'All Games' : `${cat} Games`;
      
      const emojis = {
        'All': '🔥', 'Action': '⚔️', 'Arcade': '🕹️', 'Retro': '👾', 
        'Puzzle': '🧩', '2 Player': '👥', 'Racing': '🏎️', 
        'Adventure': '🏹', 'Shooter': '🎯', 'Sports': '⚽'
      };
      document.getElementById('categoryEmoji').textContent = emojis[cat] || '🎮';

      document.querySelectorAll('.sidebar .nav-item').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(cat));
      });

      renderGrid();
    }

    function resetFilter() {
      document.getElementById('searchInput').value = '';
      filterCat('All');
    }

    function setupSearch() {
      document.getElementById('searchInput').addEventListener('input', renderGrid);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePlayer();
      });
    }

    /* Extended Smooth Loading Progress (~2.5s) */
    function startProgress() {
      const fill = document.getElementById('loaderBarFill');
      const status = document.getElementById('loaderStatus');
      const percent = document.getElementById('loaderPercent');

      let currentVal = 0;
      fill.style.width = '0%';
      percent.textContent = '0%';
      status.textContent = 'Initializing engine...';
      isIframeReady = false;

      clearInterval(progressTimer);

      progressTimer = setInterval(() => {
        if (currentVal < 90) {
          currentVal += Math.floor(Math.random() * 4) + 3; // Smooth small steps
          if (currentVal > 90) currentVal = 90;

          fill.style.width = currentVal + '%';
          percent.textContent = currentVal + '%';

          if (currentVal > 25 && currentVal < 60) status.textContent = 'Loading game assets...';
          if (currentVal >= 60 && currentVal < 85) status.textContent = 'Synchronizing WebAssembly...';
          if (currentVal >= 85) status.textContent = 'Preparing controls...';
        } else if (isIframeReady) {
          // Finish bar to 100%
          clearInterval(progressTimer);
          fill.style.width = '100%';
          percent.textContent = '100%';
          status.textContent = 'Ready! Launching...';

          setTimeout(() => {
            document.getElementById('zepioLoader').classList.add('hidden');
            focusGame();
            setTimeout(focusGame, 120);
            setTimeout(focusGame, 300);
          }, 350);
        }
      }, 70); // ~2.2s total smooth duration
    }

    /* Auto-focus on Game Canvas */
    function focusGame() {
      const iframe = document.getElementById('gameIframe');
      try {
        iframe.focus();
        if (iframe.contentWindow) {
          iframe.contentWindow.focus();
        }
      } catch (err) {
        iframe.focus();
      }
    }

    function setupStageFocus() {
      const stage = document.getElementById('iframeStage');
      stage.addEventListener('mouseenter', focusGame);
      stage.addEventListener('click', focusGame);
    }

    /* Launch & Play */
    async function launchGame(id) {
      currentGame = games.find(g => g.id === id);
      if (!currentGame) return;

      document.getElementById('activeGameTitle').textContent = currentGame.title;
      document.getElementById('plateTitle').textContent = currentGame.title;
      document.getElementById('plateCategory').textContent = currentGame.category;
      document.getElementById('plateThumb').src = currentGame.thumbnail;

      const loader = document.getElementById('zepioLoader');
      const errScreen = document.getElementById('zepioError');
      const iframe = document.getElementById('gameIframe');

      loader.classList.remove('hidden');
      errScreen.classList.remove('visible');
      document.getElementById('playerModal').classList.add('active');
      document.body.style.overflow = 'hidden';

      startProgress();

      // 404 Shield for local files
      if (currentGame.url.startsWith('./') || currentGame.url.startsWith('/')) {
        try {
          const check = await fetch(currentGame.url, { method: 'HEAD' });
          if (!check.ok) {
            clearInterval(progressTimer);
            loader.classList.add('hidden');
            errScreen.classList.add('visible');
            iframe.src = '';
            return;
          }
        } catch (e) {
          clearInterval(progressTimer);
          loader.classList.add('hidden');
          errScreen.classList.add('visible');
          iframe.src = '';
          return;
        }
      }

      iframe.src = currentGame.url;
      iframe.onload = () => {
        isIframeReady = true;
      };
    }

    function closePlayer() {
      clearInterval(progressTimer);
      document.getElementById('playerModal').classList.remove('active');
      document.getElementById('gameIframe').src = '';
      document.body.style.overflow = 'auto';
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }

    function reloadGame() {
      if (currentGame) launchGame(currentGame.id);
    }

    function toggleFullscreen() {
      const target = document.getElementById('playerWindow');
      if (!document.fullscreenElement) {
        target.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
      setTimeout(focusGame, 150);
    }

    init();
  </script>
</body>
</html>
